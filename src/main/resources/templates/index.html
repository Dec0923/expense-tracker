<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支出トラッカー</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .total-amount { font-size: 2rem; color: #007bff; font-weight: bold; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        .item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <p style="margin:0; color:#666;">今月の合計支出</p>
            <div class="total-amount">¥ [[${total}]]</div>
        </div>

        <div class="card">
            <form action="/add" method="post">
                <input type="text" name="title" placeholder="何に使った？" required>
                <input type="number" name="amount" placeholder="金額" required>
                <select name="category">
                    <option value="食費">食費</option>
                    <option value="生活費">生活費</option>
                    <option value="娯楽">娯楽</option>
                </select>
                <button type="submit">記録する</button>
            </form>
        </div>

        <div class="card">
            <h3>履歴</h3>
            <div th:each="item : ${list}" class="item">
                <span>[[${item.title}]] <small style="color:#999;">([[${item.category}]])</small></span>
                <span style="font-weight:bold;">¥[[${item.amount}]]</span>
            </div>
        </div>
    </div>
</body>
</html>
