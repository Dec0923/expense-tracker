<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支出トラッカー</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .total-amount { font-size: 2rem; color: #007bff; font-weight: bold; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        .item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dotted #ccc; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <p style="margin:0; color:#666;">現在の合計支出</p>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div class="total-amount">¥ [[${total}]]</div>
                <form action="/save-total" method="post" style="margin:0;">
                    <input type="hidden" name="total" th:value="${total}">
                    <button type="submit" style="width:auto; background:#28a745; padding:8px 15px;">合計を記録</button>
                </form>
            </div>
        </div>

        <div class="card">
            <form action="/add" method="post">
                <input type="text" name="title" placeholder="何に使った？" required>
                <input type="number" name="amount" placeholder="金額" required>
                <button type="submit">記録する</button>
            </form>
        </div>

        <div class="card">
            <h3>今回の支出明細</h3>
            <div th:each="item : ${list}" class="item">
                <div>
                    <span th:text="${item.title}">タイトル</span>
                    <span style="font-weight:bold; margin-left:10px;">¥[[${item.amount}]]</span>
                </div>
                <form action="/delete" method="post" style="margin:0;">
                    <input type="hidden" name="id" th:value="${item.id}">
                    <button type="submit" style="background:none; color:#dc3545; border:none; width:auto; padding:0; cursor:pointer; font-size:0.8rem;">削除</button>
                </form>
            </div>
        </div>

        <div class="card" th:if="${!history.isEmpty()}">
            <h3>過去の合計記録</h3>
            <div th:each="h : ${history}" class="history-item">
                <span th:text="${#dates.format(h.recorded_at, 'yyyy/MM/dd HH:mm')}">日時</span>
                <span style="font-weight:bold;">¥ [[${h.recorded_total}]]</span>
            </div>
        </div>
    </div>
</body>
</html>
